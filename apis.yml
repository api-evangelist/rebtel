name: rebtel
description: >-
  Rebtel is a Swedish international communications company (Rebtel Networks AB,
  registered 556680-3622, headquartered in Stockholm) serving the world's roughly
  two billion international migrants with low-cost international calling, mobile
  top-up / airtime recharge, and calling cards delivered through its iOS and
  Android apps. It routes calls over optimized local phone lines to keep prices
  low. Backed by Balderton Capital and Index Ventures. Rebtel exposes no public
  developer API or SDK program; this profile captures the company's public web,
  legal, support, and security.txt surface for the API Evangelist network.
